[package]
name = "sobaka-dsp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
numeric-array = "0.5.2"
async-std = { version = "1.12.0" }
futures-channel = "0.3.26"

rustfft = { version = "6.0.1" }
fundsp = "0.20.0"

waw = { git = "https://github.com/Marcel-G/waw-rs", rev="8aa1ed76deccafe3d9b169c773b0f6bacc466738" }
wasm-bindgen = { version = "0.2.98" }
wasm-bindgen-futures = { version = "0.4.48" }

serde_bytes = "0.11"
bytemuck = "1.12.3"

js-sys = "0.3.80"

# @todo remove this dependency - https://gitlab.com/KonradBorowski/enum-map/-/issues/22
enum-map = "2.4.1"
tsify = { version = "0.4.3", features = ["js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }

# `wee_alloc` is a tiny allocator for wasm that is only ~1K in code size
# compared to the default allocator's ~10K. It is slower than the default
# allocator, however.
#
# Unfortunately, `wee_alloc` requires nightly Rust when targeting wasm for now.
wee_alloc = { version = "0.4.5", optional = true }
getrandom = { version = "0.2", features = ["custom"] }

[dependencies.web-sys]
version = "0.3.59"
features = [
  'ErrorEvent',
  'Event',
  'Window',
  'Worker',
	'WorkerOptions',
	'WorkerType',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
]


[dev-dependencies]
anyhow = "1.0.56"

[profile.release]
# TODO setting opt-level = 1+ causes build failure: wasm_bindgen::__rt::wbg_cast::breaks_if_inlined::hdd77fa1f6c243ef3: unknown instruction Block(Block { seq: Id { idx: 1 } })
#       https://github.com/wasm-bindgen/wasm-bindgen/blob/4d43146fc6b179c3e66809a4cf08c9858b38e4bf/CHANGELOG.md?plain=1#L37-L41
opt-level = 0
# TODO: look into why this needs to be enabled. 
#       https://github.com/daxpedda/wasm-worker/blob/ce376d95dbdd9e7b59ac7de9c6f14090076f7865/src/thread/atomics/memory.rs#L26
debug-assertions = true
