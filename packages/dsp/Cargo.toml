[package]
name = "sobaka-dsp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
debug-audio = []

[dependencies]
rustfft = { version = "6.0.1" }
fundsp = "0.20.0"
waw = { path = "../../../waw-rs/waw" }
# waw = { git = "https://github.com/Marcel-G/waw-rs", rev="8aa1ed76deccafe3d9b169c773b0f6bacc466738" }
wasm-bindgen = { version = "0.2.98" }
wasm-bindgen-futures = { version = "0.4.48" }
getrandom = { version = "0.2", features = ["custom"] }

console_error_panic_hook = { version = "0.1.6", optional = true }
wee_alloc = { version = "0.4.5", optional = true }

js-sys = "0.3.80"
[dependencies.web-sys]
version = "0.3.59"
features = [
  'ErrorEvent',
  'Event',
  'Window',
  'Worker',
	'WorkerOptions',
	'WorkerType',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
]


[dev-dependencies]
anyhow = "1.0.56"

[profile.release]
# TODO setting opt-level = > 1 causes build failure: wasm_bindgen::__rt::wbg_cast::breaks_if_inlined::hdd77fa1f6c243ef3: unknown instruction Block(Block { seq: Id { idx: 1 } })
#       https://github.com/wasm-bindgen/wasm-bindgen/blob/4d43146fc6b179c3e66809a4cf08c9858b38e4bf/CHANGELOG.md?plain=1#L37-L41
opt-level = 2
# TODO: look into why this needs to be enabled. 
#       https://github.com/daxpedda/wasm-worker/blob/ce376d95dbdd9e7b59ac7de9c6f14090076f7865/src/thread/atomics/memory.rs#L26
debug-assertions = true
