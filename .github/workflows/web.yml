name: "Web"

on:
  push:
    branches: [master, next]
    paths:
      - '.github/workflows/web.yml'
      - 'apps/web/**'
      - 'packages/**'
  pull_request:
    branches: [master, next]
    paths:
      - '.github/workflows/web.yml'
      - 'apps/web/**'
      - 'packages/**'

jobs:
  build:
    name: "🧦 Build"
    runs-on: macos-latest
    environment:
      name: next # TODO: move to cf function
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
            toolchain: nightly
            components: rust-src
            target: wasm32-unknown-unknown
            override: true
      # Cache somehow breaks wasm_opt
      # https://github.com/Marcel-G/xtask-wasm/blob/main/src/wasm_opt.rs#L38
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #       workspaces: packages/dsp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
        working-directory: .
      - run: npm run build:web
        working-directory: .
        env:
          PUBLIC_SIGNALING_URL: ${{ vars.PUBLIC_SIGNALING_URL }}
          PUBLIC_GLOBAL_LISTS: ${{ vars.PUBLIC_GLOBAL_LISTS }}
          METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build-output
          path: apps/web/build

  infrastructure:
    needs:
      - build
    uses: ./.github/workflows/infrastructure.yml
    secrets: inherit

  deploy:
    name: "🏃‍♂️ Deploy"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - infrastructure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: us-east-1
          role-to-assume: ${{ needs.infrastructure.outputs.deploy_role }}
          role-session-name: DeploySession
      - uses: actions/download-artifact@v4
        with:
          name: web-build-output
          path: apps/web/build
      - name: "Deploy files to S3"
        run: |
          aws s3 sync apps/web/build s3://${{ needs.infrastructure.outputs.deploy_bucket }} \
            --metadata-directive REPLACE \
            --cache-control 'max-age=31104000'
          
           aws s3 cp apps/web/build/index.html s3://${{ needs.infrastructure.outputs.deploy_bucket }} \
            --metadata-directive REPLACE \
            --cache-control 'max-age=3600'
      - name: "Invalidate CloudFront Cache"
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infrastructure.outputs.cdn_distribution_id }} \
            --paths "/index.html"


concurrency: 
  group: "${{ github.ref }}-web"
  cancel-in-progress: true
