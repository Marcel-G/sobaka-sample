[package]
name = "sobaka-client"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
str0m = "0.6.2"
systemstat = "0.2.3"
tokio = { version = "1.34", features = ["rt", "sync", "time", "signal", "rt-multi-thread", "macros"] }
tokio-tungstenite = "0.24.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5.2"
yrs = "0.21"
yrs-kvstore = "0.3.1"
yrs-lmdb = "0.3.1"
lmdb-rs = "0.8"
cookie = "0.18"
dotenv = "0.15"

[profile.release]
opt-level = 1 # TODO: lmdb-rs encounters a segfault when compiled with optimizations

[patch.crates-io]
yrs-kvstore = { git = "https://github.com/Marcel-G/yrs-persistence" }
yrs-lmdb = { git = "https://github.com/Marcel-G/yrs-persistence" }
liblmdb-sys = { git = "https://github.com/tari-project/lmdb-rs" }
lmdb-rs = { git = "https://github.com/tari-project/lmdb-rs" }

